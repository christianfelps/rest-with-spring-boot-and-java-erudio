server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,http://localhost:3000
spring:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
  
logging:
  level:
    root: INFO
   # br.com.christianfelps: info

spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true






